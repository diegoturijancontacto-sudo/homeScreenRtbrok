<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>RTBROK Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs (modular) -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js"
            }
        }
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #f1f5f9;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            user-select: none;
        }

        ::-webkit-scrollbar {
            width: 2px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            padding: 0 4px;
        }

        .grid-3 .action-btn {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            border: 1px solid #171717;
            border-radius: 14px;
            transition: all 0.15s ease;
            padding: 8px 0;
            width: 100%;
            text-align: center;
            gap: 4px;
        }

        .grid-3 .action-btn:active {
            transform: scale(0.94);
            background: #141414;
            border-color: #2a2a2a;
        }

        .grid-3 .action-btn i {
            font-size: 24px;
            color: #e2e8f0;
            margin-bottom: 2px;
        }

        .grid-3 .action-btn span {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #94a3b8;
            line-height: 1.2;
            max-width: 100%;
            word-break: break-word;
        }

        .grid-3 .action-btn .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 7px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 20px;
            letter-spacing: 0.2px;
            border: 1px solid rgba(99, 102, 241, 0.1);
            margin-top: 2px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        .artwork-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            width: 100%;
        }

        .artwork-grid .art-item {
            aspect-ratio: 1;
            background: #0a0a0a;
            border: 1px solid #141414;
            overflow: hidden;
            position: relative;
            border-radius: 2px;
        }

        .artwork-grid .art-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.25s ease;
        }

        .artwork-grid .art-item:active img {
            transform: scale(1.02);
        }

        .artwork-grid .art-item .art-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 1px 6px;
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #a1a1aa;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2px;
        }

        .artwork-grid .art-item .promo-tag {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(2px);
            padding: 1px 5px;
            font-size: 6px;
            font-weight: 500;
            color: #c084fc;
            border: 1px solid rgba(192, 132, 252, 0.15);
            border-radius: 2px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .bottom-nav {
            background: #000;
            border-top: 1px solid #171717;
            padding: 8px 6px 12px;
            padding-bottom: env(safe-area-inset-bottom, 12px);
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-shrink: 0;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: transparent;
            border: none;
            color: #6b7280;
            font-size: 9px;
            font-weight: 500;
            padding: 4px 8px;
            transition: color 0.15s;
            border-radius: 8px;
        }

        .bottom-nav .nav-item:active {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.04);
        }

        .bottom-nav .nav-item i {
            font-size: 20px;
            margin-bottom: 1px;
        }

        .bottom-nav .nav-item.active {
            color: #e2e8f0;
        }

        .user-avatar-xs {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #2a2a2a;
            object-fit: cover;
            cursor: pointer;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.06);
            border-top-color: #f1f5f9;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-text {
            margin-top: 14px;
            color: #52525b;
            font-size: 10px;
            letter-spacing: 0.15em;
            font-weight: 400;
        }

        /* Detail modal compacto */
        .detail-overlay {
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .detail-card {
            max-height: 92vh;
            overflow-y: auto;
            background: #0c0c0c;
            border: 1px solid #1f1f1f;
            border-radius: 16px;
        }
        .detail-card::-webkit-scrollbar {
            width: 2px;
        }
        .detail-card::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Overlay de carga -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">RTBROK MOBILE</div>
    </div>

    <!-- App principal -->
    <div class="flex flex-col h-full w-full bg-black">

        <!-- Top Bar -->
        <header class="flex items-center justify-between px-4 py-3 border-b border-[#171717] flex-shrink-0 bg-black">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-zinc-900 border border-zinc-800 flex items-center justify-center text-white font-bold text-[10px] rounded-md">RT</div>
                <h1 class="font-bold text-sm tracking-[0.2em] bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">R T B R O K</h1>
            </div>
            <div class="flex items-center gap-2">
                <span id="headerUserName" class="text-[10px] text-zinc-400 hidden sm:inline">Usuario</span>
                <img id="sidebarUserAvatar" src="" alt="User" class="user-avatar-xs" onclick="handleUserClick()" />
                <button onclick="openLoginModal()" class="text-zinc-500 p-1.5 hover:text-white transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Scrollable contenido principal -->
        <main class="flex-1 overflow-y-auto overflow-x-hidden pb-1 px-2">

            <!-- Cuadrícula de accesos directos (3 columnas) -->
            <section class="py-3">
                <div class="grid-3">
                    <!-- Instagram -->
                    <a href="https://www.instagram.com/" target="_blank" class="action-btn">
                        <i class="fab fa-instagram fa-lg"></i>
                        <span>Instagram</span>
                    </a>
                    <!-- Base de datos -->
                    <a href="https://diegoturijancontacto-sudo.github.io/Finanzas/mobile/" target="_blank" class="action-btn">
                        <i data-lucide="database" class="w-6 h-6"></i>
                        <span>Base de datos</span>
                    </a>
                    <!-- Drive -->
                    <a href="https://drive.google.com" target="_blank" class="action-btn">
                        <i data-lucide="hard-drive" class="w-6 h-6"></i>
                        <span>Drive</span>
                    </a>
                    <!-- Generador de Catálogos -->
                    <a href="https://frontline-zeta-ecru.vercel.app/movil/" target="_blank" class="action-btn">
                        <i data-lucide="book-open" class="w-6 h-6"></i>
                        <span>Catálogos</span>
                        <span class="badge">PDF</span>
                    </a>
                    <!-- Generador de Certificados -->
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdC-_if3uzNyq3BuU3YhlUD1ONInOwe4Cv_G4MM1PJrnsDRuw/viewform?usp=header" target="_blank" class="action-btn">
                        <i data-lucide="file-text" class="w-6 h-6"></i>
                        <span>Certificados</span>
                        <span class="badge">form</span>
                    </a>
                    <!-- Obras (abre galería) -->
                    <button onclick="switchTab('artworks')" class="action-btn">
                        <i data-lucide="image" class="w-6 h-6"></i>
                        <span>Obras</span>
                        <span class="badge" id="artworksCount">0</span>
                    </button>
                </div>
            </section>

            <!-- Galería de obras (grid 3 columnas) -->
            <section class="pb-4">
                <div class="flex items-center justify-between mb-2 px-1">
                    <h2 class="text-xs font-medium text-zinc-300 tracking-wider">OBRAS RECIENTES</h2>
                    <span class="text-[9px] text-zinc-500" id="totalArtworksLabel">0 obras</span>
                </div>
                <div id="artworksGrid" class="artwork-grid">
                    <!-- Renderizado por JS -->
                </div>
                <div class="flex justify-center mt-4">
                    <button id="showMoreBtn" onclick="showMoreArtworks()" class="text-[10px] text-zinc-400 border border-zinc-800 px-5 py-2 rounded-full hover:border-zinc-600 transition flex items-center gap-2">
                        <i data-lucide="plus" class="w-3 h-3"></i> Mostrar más
                    </button>
                </div>
            </section>

        </main>

        <!-- Bottom Navigation (Accesos rápidos) -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('dashboard')">
                <i data-lucide="layout-grid"></i>
                <span>Inicio</span>
            </button>
            <button class="nav-item" onclick="switchTab('artworks')">
                <i data-lucide="image"></i>
                <span>Obras</span>
            </button>
            <button class="nav-item" onclick="openAddTaskModal()">
                <i data-lucide="plus-circle"></i>
                <span>Nuevo</span>
            </button>
            <button class="nav-item" onclick="openChatSenderModal()">
                <i data-lucide="message-square"></i>
                <span>Chat</span>
            </button>
            <button class="nav-item" onclick="openLoginModal()">
                <i data-lucide="user"></i>
                <span>Perfil</span>
            </button>
        </nav>
    </div>

    <!-- MODAL: Detalle de obra (compacto) -->
    <div id="artworkDetailModal" class="fixed inset-0 detail-overlay z-50 hidden flex items-center justify-center p-3">
        <div class="detail-card w-full max-w-sm p-4">
            <div class="flex items-start justify-between border-b border-zinc-900 pb-3 mb-3">
                <div class="flex-1 min-w-0 pr-2">
                    <h3 id="detailTitle" class="font-bold text-sm text-white truncate">Obra</h3>
                    <p id="detailSubtitle" class="text-[10px] text-zinc-400 truncate">Autor · Ubicación</p>
                </div>
                <button onclick="closeArtworkDetail()" class="text-zinc-500 hover:text-white p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="flex flex-col gap-3">
                <div class="bg-zinc-900 rounded-md overflow-hidden">
                    <img id="detailImage" src="" alt="Obra" class="w-full h-auto max-h-56 object-cover">
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div><span class="text-[9px] text-zinc-500">Estatus</span><p id="detailStatus" class="font-medium text-slate-200">-</p></div>
                    <div><span class="text-[9px] text-zinc-500">Tipo</span><p id="detailType" class="font-medium text-slate-200">-</p></div>
                    <div><span class="text-[9px] text-zinc-500">Superficie</span><p id="detailArea" class="font-medium text-slate-200">-</p></div>
                    <div><span class="text-[9px] text-zinc-500">Precio</span><p id="detailPrice" class="font-medium text-emerald-400">-</p></div>
                </div>
                <div class="text-xs">
                    <span class="text-[9px] text-zinc-500">Medidas</span>
                    <p id="detailMeasures" class="text-slate-300">-</p>
                </div>
                <div class="flex flex-wrap gap-1.5" id="detailTags"></div>
                <div class="flex gap-3 pt-2 border-t border-zinc-900">
                    <button onclick="shareArtworkWhatsApp()" class="flex-1 bg-emerald-950/40 border border-emerald-700/50 text-emerald-300 text-[10px] font-medium py-2 rounded flex items-center justify-center gap-1.5">
                        <i data-lucide="share-2" class="w-3.5 h-3.5"></i> WhatsApp
                    </button>
                    <button onclick="toggleArtworkPromotion()" id="togglePromotionBtn" class="flex-1 border border-zinc-700 bg-zinc-900 text-zinc-300 text-[10px] font-medium py-2 rounded flex items-center justify-center gap-1.5">
                        <i data-lucide="megaphone" class="w-3.5 h-3.5"></i> Promocionar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Login / Usuario -->
    <div id="loginModal" class="fixed inset-0 detail-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-zinc-900 w-full max-w-xs p-5 rounded-2xl">
            <div class="flex items-center justify-between border-b border-zinc-900 pb-3 mb-4">
                <h3 class="font-bold text-sm text-slate-100 flex items-center gap-2">
                    <i data-lucide="shield" class="w-4 h-4"></i> Usuario
                </h3>
                <button onclick="closeLoginModal()" class="text-zinc-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="firebaseUserOption" class="hidden flex flex-col gap-2 mb-3">
                <div class="flex items-center gap-3 p-2 bg-zinc-900 border border-zinc-800 rounded-lg">
                    <img id="modalUserAvatar" src="" alt="avatar" class="w-9 h-9 rounded-full border border-zinc-700">
                    <div class="flex-1 min-w-0">
                        <p id="modalUserName" class="text-sm font-medium text-white truncate">Usuario</p>
                        <p id="modalUserEmail" class="text-[10px] text-zinc-400 truncate">email</p>
                    </div>
                    <button onclick="useFirebaseUser()" class="text-[10px] bg-indigo-600 text-white px-3 py-1.5 rounded">Usar</button>
                </div>
                <button onclick="logoutFirebase()" class="text-[10px] text-rose-400 text-center">Cerrar sesión</button>
            </div>
            <div id="loginUsersList" class="flex flex-col gap-2 max-h-52 overflow-y-auto">
                <div class="text-center text-zinc-500 text-xs py-4">Cargando...</div>
            </div>
            <button onclick="goToLoginPage()" class="w-full mt-3 text-[10px] text-zinc-400 hover:text-white py-2 border-t border-zinc-900 flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-3.5 h-3.5"></i> Iniciar con Google
            </button>
        </div>
    </div>

    <!-- MODAL: Nueva tarea (light) -->
    <div id="taskModal" class="fixed inset-0 detail-overlay z-50 hidden flex items-center justify-center p-3">
        <div class="bg-zinc-950 border border-zinc-900 w-full max-w-sm p-4 rounded-2xl">
            <div class="flex items-center justify-between border-b border-zinc-900 pb-3 mb-3">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4 text-indigo-400"></i> Nueva tarea
                </h3>
                <button onclick="closeTaskModal()" class="text-zinc-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="flex flex-col gap-3">
                <div>
                    <label class="text-[10px] font-medium text-zinc-400">Proyecto</label>
                    <select id="projectSelect" class="w-full bg-zinc-900 border border-zinc-800 px-3 py-2 text-xs text-slate-200 rounded focus:border-indigo-500 outline-none">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-medium text-zinc-400">Subproyecto</label>
                    <select id="subprojectSelect" class="w-full bg-zinc-900 border border-zinc-800 px-3 py-2 text-xs text-slate-200 rounded focus:border-indigo-500 outline-none" disabled>
                        <option value="">Primero selecciona proyecto</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-medium text-zinc-400">Responsable</label>
                    <select id="responsibleSelect" class="w-full bg-zinc-900 border border-zinc-800 px-3 py-2 text-xs text-slate-200 rounded focus:border-indigo-500 outline-none">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-medium text-zinc-400">Detalles</label>
                    <input type="text" id="taskDetails" placeholder="Ej: Revisar documentación..." class="w-full bg-zinc-900 border border-zinc-800 px-3 py-2 text-xs text-slate-100 placeholder-zinc-500 rounded focus:border-indigo-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-medium text-zinc-400">Prioridad</label>
                        <select id="taskPriority" class="w-full bg-zinc-900 border border-zinc-800 px-2 py-2 text-xs text-slate-200 rounded focus:border-indigo-500 outline-none">
                            <option value="baja">Baja</option>
                            <option value="media" selected>Media</option>
                            <option value="alta">Alta</option>
                            <option value="urgente">Urgente</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-medium text-zinc-400">Límite</label>
                        <input type="date" id="taskDeadline" class="w-full bg-zinc-900 border border-zinc-800 px-2 py-2 text-xs text-slate-200 rounded focus:border-indigo-500 outline-none">
                    </div>
                </div>
                <button onclick="confirmAddTask()" class="bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 text-xs font-semibold rounded flex items-center justify-center gap-2 transition">
                    <i data-lucide="plus" class="w-4 h-4"></i> Crear tarea
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: Seleccionar remitente chat -->
    <div id="chatSenderModal" class="fixed inset-0 detail-overlay z-50 hidden flex items-center justify-center p-3">
        <div class="bg-zinc-950 border border-zinc-900 w-full max-w-xs p-4 rounded-2xl">
            <div class="flex items-center justify-between border-b border-zinc-900 pb-3 mb-3">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <i data-lucide="user-check" class="w-4 h-4"></i> Remitente
                </h3>
                <button onclick="closeChatSenderModal()" class="text-zinc-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setChatSender('Isabel')" class="p-3 bg-zinc-900 border border-zinc-800 rounded text-xs font-medium text-slate-200 hover:border-zinc-600 transition">Isabel</button>
                <button onclick="setChatSender('Santiago')" class="p-3 bg-zinc-900 border border-zinc-800 rounded text-xs font-medium text-slate-200 hover:border-zinc-600 transition">Santiago</button>
                <button onclick="setChatSender('Diego')" class="p-3 bg-zinc-900 border border-zinc-800 rounded text-xs font-medium text-slate-200 hover:border-zinc-600 transition">Diego</button>
                <button onclick="setChatSender('José Manuel')" class="p-3 bg-zinc-900 border border-zinc-800 rounded text-xs font-medium text-slate-200 hover:border-zinc-600 transition">José Manuel</button>
            </div>
            <div id="pendingMsgContainer" class="hidden mt-3 text-amber-400 text-[10px] bg-amber-500/10 border border-amber-500/20 p-2 rounded flex items-center gap-2">
                <i data-lucide="message-square" class="w-3 h-3"></i>
                <span id="pendingMsgText">Mensaje pendiente</span>
            </div>
        </div>
    </div>

    <script type="module">
        // ============================================================
        // FIREBASE AUTH
        // ============================================================
        import { initializeApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged, signOut } from 'firebase/auth';

        const firebaseConfig = {
            apiKey: "AIzaSyD1g7Y77PR2Wdylb05M2Kxz-DCKt4kNLXo",
            authDomain: "rtbrok-auth.firebaseapp.com",
            projectId: "rtbrok-auth",
            storageBucket: "rtbrok-auth.firebasestorage.app",
            messagingSenderId: "778465907066",
            appId: "1:778465907066:web:6831c57e3bdb6dded8c6c3",
            measurementId: "G-1Z2X1293ZN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let firebaseUser = null;
        let authChecked = false;

        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        let artworks = [];
        let responsables = [];
        let proyectos = [];
        let subproyectos = [];
        let localTasks = JSON.parse(localStorage.getItem('rtbrok_local_tasks') || '[]');
        let currentChatSender = localStorage.getItem('rtbrok_chat_sender') || null;
        let pendingChatMessage = null;

        // ============================================================
        // UTILIDADES
        // ============================================================
        function resolveImageUrl(adjuntos, fallback) {
            if (Array.isArray(adjuntos) && adjuntos.length > 0 && adjuntos[0]?.url) {
                let raw = adjuntos[0].url;
                if (raw.includes('drive.google.com')) {
                    const match = raw.match(/\/d\/([a-zA-Z0-9_-]+)/) || raw.match(/id=([a-zA-Z0-9_-]+)/);
                    if (match) return `https://lh3.googleusercontent.com/d/${match[1]}=w400`;
                }
                return raw;
            }
            return `https://placehold.co/400x400/18181b/71717a?text=${encodeURIComponent(fallback || 'Obra')}`;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showNotification(msg) {
            const el = document.createElement('div');
            el.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-zinc-900 border border-indigo-600/30 px-5 py-2.5 rounded-full shadow-2xl z-[100] text-xs text-slate-200 flex items-center gap-2';
            el.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-indigo-400"></i> ${msg}`;
            document.body.appendChild(el);
            lucide.createIcons();
            setTimeout(() => { el.style.opacity = '0';
                setTimeout(() => el.remove(), 300); }, 2200);
        }

        // ============================================================
        // INICIO
        // ============================================================
        window.onload = function() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');

            // Rescatar usuario de sessionStorage
            const saved = sessionStorage.getItem('firebaseUser');
            if (saved) {
                try {
                    firebaseUser = JSON.parse(saved);
                    updateUserUI(firebaseUser);
                } catch (_) {}
            }

            onAuthStateChanged(auth, (user) => {
                authChecked = true;
                if (user) {
                    const data = { uid: user.uid, displayName: user.displayName, email: user.email,
                    photoURL: user.photoURL };
                    firebaseUser = data;
                    sessionStorage.setItem('firebaseUser', JSON.stringify(data));
                    updateUserUI(data);
                } else {
                    const savedUser = sessionStorage.getItem('firebaseUser');
                    if (savedUser) {
                        try { firebaseUser = JSON.parse(savedUser);
                            updateUserUI(firebaseUser); } catch (_) {}
                    } else {
                        updateUserUI(null);
                    }
                }
                overlay.classList.add('hidden');
                initApp();
            });

            setTimeout(() => {
                if (!authChecked) {
                    window.location.href = 'login.html';
                }
            }, 3000);
        };

        function initApp() {
            fetchArtworks();
            fetchResponsables();
            fetchProjects();
            renderLocalTasks();
            updateChatSenderUI();

            const today = new Date();
            const weekLater = new Date(today);
            weekLater.setDate(today.getDate() + 7);
            document.getElementById('taskDeadline').value = weekLater.toISOString().split('T')[0];

            // Mostrar total de obras
            updateArtworksCount();
        }

        async function fetchArtworks() {
            try {

                const data = await res.json();
                artworks = data.registrosObra || data.data || [];
            } catch (_) {
                artworks = getMockArtworks();
            }
            renderArtworks();
            updateArtworksCount();
        }

        async function fetchResponsables() {
            try {
                const res = await fetch(ENDPOINT_TASKS);
                const data = await res.json();
                responsables = data.responsables || [];
                populateResponsibleSelect();
                renderLoginUsers();
            } catch (_) {
                responsables = [];
                populateResponsibleSelect();
                renderLoginUsers();
            }
        }

        async function fetchProjects() {
            try {
                const res = await fetch(ENDPOINT_TASKS);
                const data = await res.json();
                proyectos = data.proyectos || [];
                subproyectos = data.subproyectos || [];
                populateProjectSelect();

                proyectos = [];
                subproyectos = [];

        // ============================================================
        // RENDER ARTWORKS (grid 3 columnas)
        // ============================================================
        function renderArtworks() {
            const grid = document.getElementById('artworksGrid');
            const sorted = [...artworks].sort((a, b) => new Date(b.fecha_registro || 0) - new Date(a.fecha_registro || 0));
            const toShow = sorted.slice(0, displayedArtworks);

            if (toShow.length === 0) {
                grid.innerHTML =
                    `<div class="col-span-3 text-center text-zinc-500 text-xs py-8">No hay obras registradas</div>`;
                return;
            }

            grid.innerHTML = toShow.map(a => {
                const img = resolveImageUrl(a.adjuntos, a.nombre_obra);
                const statusColor = { 'Consolidación': 'border-amber-500/30 text-amber-400', 'Bodega': 'border-blue-500/30 text-blue-400',
                    'Vendida': 'border-emerald-500/30 text-emerald-400' } [a.estatus] || 'border-zinc-500/30 text-zinc-400';
                return `
                    <div class="art-item" onclick="openArtworkDetail('${a.id}')">
                        <img src="${img}" alt="${a.nombre_obra || 'Obra'}" loading="lazy"
                             onerror="this.onerror=null; this.src='https://placehold.co/400x400/18181b/71717a?text=Obra';">
                        <div class="art-badge ${statusColor}">${a.estatus || 'Consolidación'}</div>
                        ${a.promocionar ? `<div class="promo-tag"><i data-lucide="megaphone" class="w-2.5 h-2.5"></i> Promo</div>` : ''}
                    </div>
                `;
            }).join('');

            // Mostrar/ocultar botón "Mostrar más"
            const btn = document.getElementById('showMoreBtn');
            if (displayedArtworks >= sorted.length) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'flex';
            }

            lucide.createIcons();
        }

        function populateProjectSelect() {
            const sel = document.getElementById('projectSelect');
            sel.innerHTML = '<option value="">Seleccionar proyecto...</option>';
            proyectos.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.asignacion || ''} - ${p.nombre}`;
                sel.appendChild(opt);
            });
            sel.onchange = function() {
                const pid = this.value;
                const subSel = document.getElementById('subprojectSelect');
                if (pid) {
                    const subs = subproyectos.filter(sp => sp.id_proyecto === pid);
                    subSel.disabled = false;
                    subSel.innerHTML = '<option value="">Seleccionar subproyecto...</option>';
                    subs.forEach(sp => {
                        const opt = document.createElement('option');
                        opt.value = sp.id;
                        opt.textContent = `${sp.asignacion || ''} - ${sp.nombre}`;
                        subSel.appendChild(opt);
                    });
                } else {
                    subSel.disabled = true;
                    subSel.innerHTML = '<option value="">Primero selecciona proyecto</option>';
                }
            };
        }

        function populateResponsibleSelect() {
            const sel = document.getElementById('responsibleSelect');
            sel.innerHTML = '<option value="">Seleccionar responsable...</option>';
            responsables.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                const badge = r.rol ? ` [${r.rol}]` : '';
                opt.textContent = `${r.nombre || 'Sin nombre'}${badge}`;
                sel.appendChild(opt);
            });

        window.confirmAddTask = function() {
            const project = document.getElementById('projectSelect').value;
            const subproject = document.getElementById('subprojectSelect').value;
            const responsible = document.getElementById('responsibleSelect').value;
            const details = document.getElementById('taskDetails').value.trim();
            const priority = document.getElementById('taskPriority').value;
            const deadline = document.getElementById('taskDeadline').value;

            if (!project || !subproject || !responsible || !details) {
                showNotification('Completa todos los campos');
                return;
            }

            const taskId = 'T_' + Date.now().toString(36).toUpperCase();
            const payload = {
                action: 'tarea_add',
                data: {
                    id: taskId,
                    id_subproyecto: subproject,
                    id_responsable: responsible,
                    prioridad: priority,
                    estatus: 'pendiente',
                    detalles: details,
                    descripcion: '',
                    fecha_limite: deadline || ''
                }
            };

            fetch(ENDPOINT_TASKS, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                showNotification('Tarea creada');
                closeTaskModal();
                document.getElementById('taskDetails').value = '';
            }).catch(() => {
                showNotification('Error al crear tarea');
            });
        };
