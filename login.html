<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTBROK · Iniciar Sesión</title>

    <!-- Tailwind + Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- Firebase SDKs (modular) -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js"
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
        }

        .glass-card {
            background: rgba(12, 12, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .btn-google {
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.01);
        }

        .brand-gradient {
            background: linear-gradient(135deg, #fafafa 0%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- Contenedor principal -->
    <div class="w-full max-w-md">

        <!-- Logo / título -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-zinc-900 border border-zinc-800 rounded-sm mb-4 shadow-2xl">
                <span class="text-white font-bold text-xl tracking-[0.2em]">RT</span>
            </div>
            <h1 class="text-3xl font-bold tracking-[0.15em] brand-gradient">R T B R O K</h1>
            <p class="text-zinc-400 text-xs tracking-widest mt-1.5">WORKSPACE · AUTENTIFICACIÓN</p>
        </div>

        <!-- Tarjeta de login -->
        <div class="glass-card rounded-sm p-8 shadow-2xl transition-all">

            <!-- Estado / mensajes -->
            <div id="statusMessage" class="mb-5 text-center text-sm text-zinc-400 min-h-[1.5rem]">
                Accede con tu cuenta de Google
            </div>

            <!-- Botón de Google -->
            <button id="googleLoginBtn" class="btn-google w-full flex items-center justify-center gap-3 py-3.5 px-4 rounded-sm text-white font-medium text-sm transition shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#fbc02d" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12
                    c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24
                    c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                    <path fill="#e53935" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039
                    l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                    <path fill="#4caf50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36
                    c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                    <path fill="#1565c0" d="M43.611,20.083L43.595,20L24,20v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571
                    c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
                </svg>
                <span>Iniciar sesión con Google</span>
            </button>

            <!-- Separador sutil -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-zinc-800/60"></div>
                </div>
                <div class="relative flex justify-center text-xs">
                    <span class="px-3 bg-[#0c0c0f] text-zinc-500">o</span>
                </div>
            </div>

            <!-- Usuario autenticado (se muestra después del login) -->
            <div id="userInfo" class="hidden flex-col items-center gap-3 py-2">
                <div class="flex items-center gap-4 w-full bg-zinc-900/50 border border-zinc-800/60 p-3 rounded-sm">
                    <img id="userAvatar" src="" alt="avatar" class="w-10 h-10 rounded-full border border-zinc-700" />
                    <div class="flex-1 min-w-0">
                        <p id="userName" class="text-sm font-medium text-white truncate">Usuario</p>
                        <p id="userEmail" class="text-xs text-zinc-400 truncate">email@ejemplo.com</p>
                    </div>
                </div>
                <button id="logoutBtn" class="w-full text-xs font-medium text-zinc-400 hover:text-white transition py-2 border-t border-zinc-800/60 mt-1">
                    Cerrar sesión
                </button>
                <p class="text-[10px] text-zinc-500 mt-1 tracking-wider">✔️ Autenticación exitosa</p>
            </div>

            <!-- Pie de página -->
            <div class="mt-7 pt-4 border-t border-zinc-800/50 text-center">
                <span class="text-[10px] text-zinc-500 tracking-widest">ACCESO SEGURO · FIREBASE AUTH</span>
            </div>
        </div>
    </div>

    <script type="module">
        // -----------------------------------------------
        // 1. Importar Firebase y configuración
        // -----------------------------------------------
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'firebase/auth';

        const firebaseConfig = {
            apiKey: "AIzaSyD1g7Y77PR2Wdylb05M2Kxz-DCKt4kNLXo",
            authDomain: "rtbrok-auth.firebaseapp.com",
            projectId: "rtbrok-auth",
            storageBucket: "rtbrok-auth.firebasestorage.app",
            messagingSenderId: "778465907066",
            appId: "1:778465907066:web:6831c57e3bdb6dded8c6c3",
            measurementId: "G-1Z2X1293ZN"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // -----------------------------------------------
        // 2. Referencias al DOM
        // -----------------------------------------------
        const statusEl = document.getElementById('statusMessage');
        const googleBtn = document.getElementById('googleLoginBtn');
        const userInfo = document.getElementById('userInfo');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');
        const userAvatar = document.getElementById('userAvatar');
        const logoutBtn = document.getElementById('logoutBtn');

        // -----------------------------------------------
        // 3. Funciones auxiliares (UI)
        // -----------------------------------------------
        function setStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.className = `text-sm text-center min-h-[1.5rem] transition ${isError ? 'text-rose-400' : 'text-zinc-400'}`;
        }

        function showUser(user) {
            // ocultar botón de login, mostrar info del usuario
            googleBtn.classList.add('hidden');
            userInfo.classList.remove('hidden');

            userName.textContent = user.displayName || 'Sin nombre';
            userEmail.textContent = user.email || 'sin email';
            userAvatar.src = user.photoURL || 'https://ui-avatars.com/api/?background=2d2d2d&color=fff&size=40';
            setStatus(`Bienvenido, ${user.displayName?.split(' ')[0] || 'usuario'} 👋`);
        }

        function showLogin() {
            googleBtn.classList.remove('hidden');
            userInfo.classList.add('hidden');
            setStatus('Accede con tu cuenta de Google');
        }

        // -----------------------------------------------
        // 4. Manejadores de autenticación
        // -----------------------------------------------
        async function loginWithGoogle() {
            try {
                setStatus('Abriendo ventana de Google...', false);
                googleBtn.disabled = true;

                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // usuario autenticado → se dispara onAuthStateChanged
                setStatus(`✅ Sesión iniciada como ${user.displayName}`, false);
            } catch (error) {
                console.error('Error en login:', error);
                let msg = 'Error al iniciar sesión. Intenta de nuevo.';
                if (error.code === 'auth/popup-closed-by-user') {
                    msg = 'Ventana de autenticación cerrada. Vuelve a intentarlo.';
                } else if (error.code === 'auth/network-request-failed') {
                    msg = 'Error de red. Verifica tu conexión.';
                }
                setStatus(`❌ ${msg}`, true);
            } finally {
                googleBtn.disabled = false;
            }
        }

        async function logout() {
            try {
                await signOut(auth);
                showLogin();
                setStatus('Sesión cerrada correctamente', false);
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
                setStatus('Error al cerrar sesión', true);
            }
        }

        // -----------------------------------------------
        // 5. Observador de estado de autenticación
        // -----------------------------------------------
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuario autenticado
                showUser(user);
                // Opcional: redirigir a index.html después de un breve momento
                // setTimeout(() => { window.location.href = 'index.html'; }, 800);
            } else {
                // Usuario no autenticado
                showLogin();
            }
        });

        // -----------------------------------------------
        // 6. Event listeners
        // -----------------------------------------------
        googleBtn.addEventListener('click', loginWithGoogle);
        logoutBtn.addEventListener('click', logout);

        // Prevenir que el botón de logout dispare navegación
        logoutBtn.addEventListener('click', (e) => e.preventDefault());

        // Mensaje inicial
        setStatus('Accede con tu cuenta de Google');
    </script>
</body>
</html>
