<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicaciones de Instagram · RTBROK</title>
<style>
  :root { --bg:#070a0e; --card:#0d1117; --text:#f4f4f5; --muted:#8d99a8; --line:#1a2029; --accent:#a97836; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:32px 24px 48px; background:var(--bg); color:var(--text);
         font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.45; }
  main { max-width:1200px; margin:0 auto; }
  header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px;
           padding-bottom:18px; border-bottom:1px solid var(--line); }
  h1 { font-size:clamp(1.35rem,3vw,1.8rem); letter-spacing:-.03em; margin:0 0 5px; }
  .eyebrow { color:#d2a45f; font-size:.7rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; margin:0 0 8px; }
  .sub { color:var(--muted); font-size:.85rem; margin:0; }
  #grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:7px; overflow:hidden;
          display:flex; flex-direction:column; }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#171e27; }
  .body { padding:13px 14px 15px; display:flex; flex-direction:column; gap:9px; flex:1; }
  .caption { margin:0; color:#e4e4e7; font-size:.85rem; white-space:pre-line;
             display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .meta { margin-top:auto; display:flex; justify-content:space-between; gap:12px; font-size:.72rem; color:var(--muted); }
  .meta a { color:#d2a45f; text-decoration:none; }
  .meta a:hover { color:#f0c47c; text-decoration:underline; }
  #estado { color:var(--muted); font-size:.85rem; }
  @media (max-width:600px) {
    body { padding:24px 16px 36px; }
    header { display:block; }
    .sub { margin-top:4px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="eyebrow">RTBROK · Instagram</p>
      <h1>Publicaciones recientes</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>
  <div id="grid"></div>
  <p id="estado">Cargando…</p>
</main>

<script>
// Si esta página vive en el MISMO repo donde el Actor guarda los datos, deja BASE = "instagram".
// Si vive en otro sitio, usa la URL completa, por ejemplo:
const BASE = "https://raw.githubusercontent.com/diegoturijancontacto-sudo/proyectBND/main/instagram";
// (GitHub Pages permite leer estos archivos desde otros dominios).
//const BASE = "instagram";

async function cargar() {
  const estado = document.getElementById("estado");
  try {
    const res = await fetch(`${BASE}/posts.json`, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const feed = await res.json();

    document.getElementById("sub").textContent =
      `@${feed.username} · actualizado ${new Date(feed.updated_at).toLocaleString("es-MX")}`;

    const grid = document.getElementById("grid");
    for (const p of feed.posts) {
      const card = document.createElement("article");
      card.className = "card";

      const img = document.createElement("img");
      img.src = `${BASE}/${p.image}`;
      img.alt = p.caption ? p.caption.slice(0, 120) : "Publicación de Instagram";
      img.loading = "lazy";

      const body = document.createElement("div");
      body.className = "body";

      const cap = document.createElement("p");
      cap.className = "caption";
      cap.textContent = p.caption || "";          // textContent: nunca interpreta HTML

      const meta = document.createElement("div");
      meta.className = "meta";
      const fecha = document.createElement("span");
      fecha.textContent = p.timestamp
        ? new Date(p.timestamp).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" })
        : "";
      const link = document.createElement("a");
      link.href = p.permalink;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = p.is_video ? "Ver video en Instagram" : "Ver en Instagram";
      meta.append(fecha, link);

      body.append(cap, meta);
      card.append(img, body);
      grid.append(card);
    }
    estado.remove();
  } catch (err) {
    estado.textContent = "No se pudieron cargar las publicaciones por ahora.";
    console.error(err);
  }
}
cargar();
</script>
</body>
</html>
